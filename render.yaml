# Blueprint de Render: crea la web y la base PostgreSQL con un clic.
# Render → New → Blueprint → elige este repositorio.
services:
  - type: web
    name: pardave
    runtime: node
    region: virginia # la región de Render más cercana a Perú
    plan: starter # necesario para el disco de imágenes subidas (el plan free no admite discos)
    buildCommand: npm ci && npm run render-build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pardave-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@pardave.pe
      - key: ADMIN_PASSWORD
        sync: false # Render la pide al crear el blueprint
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # p. ej. https://pardave.onrender.com o tu dominio
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: pardave-db
    region: virginia
    plan: basic-256mb
    databaseName: pardave
    user: pardave
