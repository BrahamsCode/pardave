# Blueprint de Render (plan gratuito).
# Render → Blueprints → New Blueprint Instance → elige este repositorio.
#
# La base de datos NO se crea aquí: Render solo permite una base gratuita por cuenta y
# además la elimina a los 30 días. Usa una PostgreSQL gratuita de Neon (neon.tech) y pega
# su cadena de conexión en DATABASE_URL cuando Render la pida.
services:
  - type: web
    name: pardave
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run render-build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # cadena de conexión de PostgreSQL (Neon u otra)
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@pardave.pe
      - key: ADMIN_PASSWORD
        sync: false # contraseña del administrador inicial
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # p. ej. https://pardave.onrender.com
